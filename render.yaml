# Un servicio gratuito: consola, portal y API. Usa la base existente de Tiger Data.
# New > Blueprint > selecciona este repositorio. Los secretos se completan en Render.
services:
  - type: web
    name: nexo-solar
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: cd backend && sh ../deploy/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_CA_FILE
        value: certs/tiger-ca.crt
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REASONING_EFFORT
        value: low
      - key: ASSISTANT_AUTOPILOT
        value: draft
