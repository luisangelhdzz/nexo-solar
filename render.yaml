# Despliegue en Render (Blueprint): New > Blueprint > elige este repositorio.
# Crea un servicio web (consola en / y portal en /portal) y una base PostgreSQL gratuita.
# Las variables con `sync: false` se llenan en el panel de Render; nunca se suben al repositorio.
services:
  - type: web
    name: nexo-solar
    runtime: node
    plan: free
    buildCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-solar-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: heuristic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false

databases:
  - name: nexo-solar-db
    plan: free
    databaseName: nexo_solar
    user: nexo
